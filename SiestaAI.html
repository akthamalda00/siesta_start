<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siesta A.I Solutions</title>
     <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="siestaai.css">
     <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Special+Gothic+Expanded+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0">

<body>
</div>
    <div class="chatbot-header">
        <div class="header-info">
            <a href="index.html"><img class="chatbot-logo" src="SiestaAI-Gallery/chatbot-logo.png" alt="Chatbot Logo"></a>
            <h2 class="logo-text">Siesta</h2>
        </div>
    </div>
    <div class="chat-body">
        <div class="message bot-message">
             <img class="bot-avatar" src="SiestaAI-Gallery/chatbot-logo-avatar.png" alt="Chatbot Logo">
            <div class="message-text">Whats Up! <br> How Can I Help?</div>    
        </div>
    </div>
    <div class="chat-footer">
        <form action="#" class="chat-form">
            <textarea placeholder="Message..." class="message-input" required></textarea>
            <div class="chat-controls">
            <button type="button" id="emoji-picker" class="material-symbols-rounded">sentiment_very_satisfied</button>
            <button type="button" id="attach-file" class="material-symbols-rounded">attach_file</button>
            <button type="submit" id="send-message" class="material-symbols-rounded">arrow_upward</button>
        </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/emoji-mart@latest/dist/browser.js"></script>

<script src="siesta.js"></script>

</body>
</html>
